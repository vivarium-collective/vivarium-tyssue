# Auto-generated by scripts/gen_composites.py — declarative replacement for
# the procedural get_test_*_spec() helper in tests/tests.py.
name: gillespie
description: 'Intestinal-crypt model on a cylindrical vessel: the EulerSolver handles mechanics while
  a Gillespie process stochastically fires cell-type transitions (stem -> progenitor -> enterocyte/goblet,
  extrusion) under Wnt- and density-dependent regulation.'
tags:
- tissue
- multi-cell
- cells
- kinetics
requires:
  processes:
  - EulerSolver
  - Gillespie
  types:
  - tyssue_data
  - behaviors
emitters:
- address: local:DataFrameParquetEmitter
  config:
    out_dir: out/parquet
  paths:
  - Tissue State/vert_df
  - Tissue State/face_df
  - Tissue State/edge_df
  - Tissue State/cell_df
parameters:
  interval:
    type: float
    default: 0.005
    description: Emit / update interval. Solver dt = interval / substeps.
  substeps:
    type: int
    default: 1
    description: "Native Euler steps per update (unused here \u2014 vessel gradient falls back to python)."
state:
  Tyssue:
    _type: process
    address: local:EulerSolver
    config:
      name: Test Cylinder
      eptm: workspace/datasets/crypt_cylinder.hf5
      tissue_type: Sheet
      parameters:
        # Mechanics aligned to Tasnif's original crypt cylinder model
        # (Notebooks/cylindermodel.ipynb, cell 16), which ran stably to tf=300:
        #   area_elasticity=1, prefered_area=1, perimeter_elasticity=1,
        #   prefered_perimeter=3.5, viscosity=5, surface/vessel_elasticity=5,
        #   threshold_length=0.1. The earlier soft values (viscosity 0.2,
        #   vessel_elasticity 1.0, surface_elasticity 0.1, perimeter_elasticity
        #   0.5) let the free top rim of the tube evert into a splayed "mushroom
        #   cap" (max radius blew past 30 while the rest stayed a clean r=2.5
        #   cylinder). Two things fix it: the high VESSEL_ELASTICITY modulus
        #   (5.0) pins vertices radially to prefered_radius via
        #   VesselSurfaceElasticity, and the high VISCOSITY (5.0) shortens the
        #   effective explicit-Euler step (dot_r = -grad/viscosity, ~25x smaller)
        #   so the stiff perimeter term can't buckle the rim. Result: rmax stays
        #   ~2.5-3.8 all the way to t=72 (was ~35). See the gillespie report.
        face_df:
          area_elasticity: 1.0
          prefered_area: 1.0
          perimeter_elasticity: 1.0
          prefered_perimeter: 3.5
        edge_df:
          line_tension: 0.0
          is_active: 1.0
        vert_df:
          viscosity: 5.0
          # Modulus read by the VesselSurfaceElasticity effector (its energy uses
          # `vessel_elasticity`, not the `surface_elasticity` column) — this is
          # what pins each vertex to the r=prefered_radius cylinder. 5.0 matches
          # Tasnif's surface_elasticity=5 and holds the tube; 1.0 let it evert.
          vessel_elasticity: 5.0
          prefered_radius: 2.5
          is_alive: 1.0
          surface_elasticity: 5.0
      geom: VesselGeometry
      effectors:
      - FaceAreaElasticity
      - PerimeterElasticity
      - LineTension
      - VesselSurfaceElasticity
      ref_effector: FaceAreaElasticity
      factory: model_factory_vessel
      settings:
        threshold_length: 0.1
        radius: 2.5
        axis: z
      auto_reconnect: true
      bounds: {}
      output_columns: {}
      history_columns: {}
      maps: {}
      backend: rust
      substeps: ${substeps}
      # Explicit-Euler safety net: clamp any single vertex's per-step displacement
      # to 0.2 (normal motion is ~0.02; edge length ~1.2). A division / extrusion
      # remove_face transient can briefly produce a large local gradient; without
      # the clamp one such step at ~t=49 blows the whole mesh to NaN. Clamping lets
      # that transient relax over a few steps and the crypt runs stably past t=72.
      max_displacement: 0.2
    inputs:
      behaviors:
      - Behaviors
      global_time:
      - global_time
    outputs:
      datasets:
      - Tissue State
      network_changed:
      - Network Changed
      behaviors_update:
      - Behaviors
    interval: ${interval}
  Gillespie:
    _type: process
    address: local:Gillespie
    config:
      cell_types:
      - sc
      - pc
      - ent
      - gc
      - dcs
      rates_max:
        sc:
          sc: 0.15
          pc: 0.2
        pc:
          pc: 0.22
          ent: 0.15
          gc: 0.0495
        ent:
          ex: 0.34
        gc:
          ex: 0.34
        dcs:
          dcs: 0.0
      michaelis_constants:
        sc:
          sc_wnt: 2.64
          sc_density: 1
          pc_wnt: 2.64
        pc:
          pc_wnt: 8.8
          pc_density: 1
          ent_wnt: 8.8
          gc_wnt: 8.8
        ent:
          ex_wnt: 42.9
          ex_density: 1
        gc:
          ex_wnt: 42.9
          ex_density: 1
        dcs: {}
      transition_lengths:
        sc:
          sc_wnt: 1.1
          sc_density: 0.3
          pc_wnt: 1.1
        pc:
          pc_wnt: 8.8
          pc_density: 0.3
          gc_wnt: 3.3
          ent_wnt: 3.3
        ent:
          ex_wnt: 3.3
          ex_density: 0.3
        gc:
          ex_wnt: 3.3
          ex_density: 0.3
        dcs: {}
      geom: VesselGeometry
      global_interval: 0.005
      # growth_rate / shrink_rate raised 0.02 -> 0.1 so the area-growth of a
      # committed "dividing" cell (and the prefered-area collapse of an
      # "extruding" cell) actually crosses the division_crit / death threshold
      # WITHIN the ~t=72 demo window. On the now-rigid tube the cylinder surface
      # is fixed-size, so at the old rate 0.02 a dividing cell's ACTUAL area only
      # reached ~1.13 by t=72 (< division_crit 1.2) and NO cell ever divided or
      # was extruded (0 births / 0 removals — verified true of the pre-fix
      # everting baseline too; it is rate-limited, not a mechanics artifact). At
      # 0.1 the full biology is visible: ~96 divisions + extrusions over the run,
      # nfaces 704 -> ~672 (death-dominated early) -> ~742 (division-dominated
      # late), while the tube still holds (rmax <= ~3.8). The fate-cascade rates
      # (rates_max / michaelis_constants / transition_lengths / regulations) are
      # unchanged — only the mechanical area growth/shrink timescale is faster.
      growth_rate: 0.1
      shrink_rate: 0.1
      division_crit: 1.2
      apoptosis_crit: 0.1
      regulations:
        sc:
          sc:
            wnt: negative
            density: negative
          pc:
            wnt: positive
        pc:
          ent:
            wnt: positive
          gc:
            wnt: positive
          pc:
            wnt: negative
            density: negative
        ent:
          ex:
            wnt: positive
            density: positive
        gc:
          ex:
            wnt: positive
            density: positive
        dcs: {}
      regulation_loc:
        wnt: z
    inputs:
      datasets:
      - Tissue State
      behaviors:
      - Behaviors
      global_time:
      - global_time
    outputs:
      behaviors:
      - Behaviors
      gillespie_trigger:
      - Gillespie Trigger
    interval: ${interval}
  Network Changed: false
  Behaviors: {}
